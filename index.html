<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta property="og:title" content="卤蛋">
<meta property="og:description" content="点开看看呀">
<title>卤蛋</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28C16 28 3 20 3 10.5C3 6 6 3 9.5 3C12 3 14.5 4.5 16 7C17.5 4.5 20 3 22.5 3C26 3 29 6 29 10.5C29 20 16 28 16 28Z' fill='%23FF6B9D'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage { position: fixed; inset: 0; }
  #safari-guide {
    position: fixed;
    z-index: 9999;
    inset: 0;
    padding: calc(env(safe-area-inset-top) + 72px) 24px 32px;
    color: #fff;
    background: rgba(0, 0, 0, 0.92);
    text-align: center;
    touch-action: manipulation;
  }
  #safari-guide[hidden] { display: none; }
  #safari-guide .arrow {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 8px);
    right: 18px;
    font-size: 42px;
    line-height: 1;
  }
  #safari-guide h1 { margin-top: 12vh; font-size: 24px; }
  #safari-guide p { margin-top: 14px; font-size: 17px; line-height: 1.7; }
  #open-safari {
    margin-top: 28px;
    min-width: 180px;
    min-height: 48px;
    border: 0;
    border-radius: 6px;
    color: #111;
    background: #fff;
    font-size: 17px;
    font-weight: 600;
  }
  #safari-fallback { color: #bbb; font-size: 14px !important; }
  .note {
    position: absolute;
    padding: 7px 12px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1.2;
    color: #333;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    transition: left 1.1s cubic-bezier(.25, .8, .3, 1),
                top 1.1s cubic-bezier(.25, .8, .3, 1),
                opacity 0.6s ease;
    will-change: left, top, opacity;
  }
  /* 隐藏平台注入的水印浮层 */
  [data-custom-element="doubao-watermark"],
  div[class*="watermark" i],
  div[id*="watermark" i] { display: none !important; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="safari-guide" hidden>
  <div class="arrow">↗</div>
  <h1>请在 Safari 中打开</h1>
  <p>点击右上角“···”<br>选择“在默认浏览器中打开”</p>
  <button id="open-safari" type="button">打开 Safari</button>
  <p id="safari-fallback">如果没有跳转，请按上面的步骤操作</p>
</div>
<script>
const safariGuide = document.getElementById("safari-guide");
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isWeChat = /MicroMessenger/i.test(navigator.userAgent);

function openInSafari() {
  if (location.protocol === "https:" || location.protocol === "http:") {
    location.href = "x-safari-" + location.href;
  }
}

if (isIOS && isWeChat) {
  safariGuide.hidden = false;
  document.getElementById("open-safari").addEventListener("click", openInSafari);
  setTimeout(openInSafari, 500);
}

const TIPS = [
  "多喝热水", "好好爱自己", "好好吃饭", "保持好心情",
  "我想你了", "顺顺利利", "别熬夜", "天凉了多穿衣服",
  "天天开心", "照顾好自己", "按时睡觉", "平安喜乐"
];
const COLORS = [
  "#FFB6C1", "#ADD8E6", "#90EE90", "#FFFACD",
  "#FF69B4", "#87CEEB", "#98FB98", "#FFDAB9"
];
const N = 90;
const stage = document.getElementById("stage");
const notes = [];

function heartXY(i, total, w, h, scale) {
  const th = i / total * 2 * Math.PI;
  const x = 16 * Math.pow(Math.sin(th), 3);
  const y = 13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th);
  return {
    x: w / 2 + x * scale - 55,
    y: h / 2 - y * scale - 25
  };
}

// 创建便利贴
for (let i = 0; i < N; i++) {
  const el = document.createElement("div");
  el.className = "note";
  el.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
  el.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
  stage.appendChild(el);
  notes.push({ el });
}

function place() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  // 心形大小自适应：竖屏手机上取较小值，保证不超出屏幕
  const scale = Math.min(w * 0.028, h * 0.05);
  notes.forEach((n, idx) => {
    const hp = heartXY(idx, N, w, h, scale);
    n.hx = hp.x; n.hy = hp.y;
    n.rx = Math.random() * Math.max(10, w - 100);
    n.ry = Math.random() * Math.max(10, h - 50);
  });
}

function run() {
  place();
  // 阶段1：全部先散在屏幕各处，透明
  notes.forEach((n) => {
    n.el.style.transition = "none";
    n.el.style.left = n.rx + "px";
    n.el.style.top = n.ry + "px";
    n.el.style.opacity = "0";
  });
  // 强制 reflow，再恢复 transition
  void stage.offsetWidth;
  notes.forEach((n) => {
    n.el.style.transition = "";
  });

  // 阶段2：逐个飞入，聚成爱心
  setTimeout(() => {
    notes.forEach((n, idx) => {
      setTimeout(() => {
        n.el.style.left = n.hx + "px";
        n.el.style.top = n.hy + "px";
        n.el.style.opacity = "1";
      }, idx * 15);
    });
  }, 300);

  // 阶段3：停 3.5 秒后散开铺满屏
  setTimeout(() => {
    notes.forEach((n) => {
      n.rx = Math.random() * Math.max(10, window.innerWidth - 100);
      n.ry = Math.random() * Math.max(10, window.innerHeight - 50);
      n.el.style.left = n.rx + "px";
      n.el.style.top = n.ry + "px";
    });
  }, 5500);
}

// 点击屏幕重新开始
document.addEventListener("click", run);
document.addEventListener("touchstart", (e) => { e.preventDefault(); run(); }, { passive: false });

window.addEventListener("resize", place);
run();

// 持续移除平台注入的水印浮层
const mo = new MutationObserver(() => {
  document.querySelectorAll('[data-custom-element="doubao-watermark"], div[class*="watermark" i]').forEach(el => el.remove());
});
mo.observe(document.documentElement, { childList: true, subtree: true });
</script>
</body>
</html>
